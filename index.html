<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<title>Управление школьниками и льготами</title>

<!-- Подключение библиотеки SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f4f7f6;
color: #333;
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
}

.container {
width: 100%;
max-width: 700px;
background: #fff;
border-radius: 10px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
overflow: hidden;
}

.section {
padding: 20px;
border-bottom: 1px solid #eee;
}
.section-title {
font-size: 16px;
font-weight: 600;
margin-bottom: 15px;
color: #2c3e50;
}

.form-grid {
display: grid;
grid-template-columns: 120px 1fr;
gap: 12px;
align-items: center;
}
.form-grid label {
text-align: right;
font-weight: 500;
}
.form-grid input {
padding: 8px 12px;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 14px;
outline: none;
transition: border-color 0.2s;
}
.form-grid input:focus {
border-color: #3498db;
}
.btn-add {
grid-column: 1 / -1;
margin-top: 10px;
padding: 10px;
background-color: #3498db;
color: white;
border: none;
border-radius: 5px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: background-color 0.2s;
}
.btn-add:hover {
background-color: #2980b9;
}

.controls {
display: flex;
align-items: center;
gap: 10px;
flex-wrap: wrap;
}
.btn {
padding: 6px 12px;
background-color: #ecf0f1;
color: #2c3e50;
border: 1px solid #bdc3c7;
border-radius: 4px;
cursor: pointer;
font-size: 13px;
transition: all 0.2s;
}
.btn:hover {
background-color: #bdc3c7;
}

/* Кнопка выгрузки (зеленая) */
.btn-excel {
background-color: #27ae60;
color: white;
border-color: #219a52;
}
.btn-excel:hover {
background-color: #219a52;
}
.btn-excel:disabled {
background-color: #95d5b2;
cursor: not-allowed;
}

/* Кнопка загрузки (фиолетовая) */
.btn-import {
background-color: #8e44ad;
color: white;
border-color: #7d3c98;
}
.btn-import:hover {
background-color: #7d3c98;
}

.count-label {
font-weight: bold;
font-size: 15px;
margin-left: 5px;
}
.separator {
width: 1px;
height: 24px;
background-color: #ccc;
margin: 0 5px;
}

.table-container {
padding: 20px;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}
th, td {
padding: 12px 15px;
text-align: left;
border-bottom: 1px solid #eee;
}
th {
background-color: #f8f9fa;
font-weight: 600;
color: #2c3e50;
}

th:nth-child(1), td:nth-child(1) { text-align: left; }
th:nth-child(2), td:nth-child(2) { text-align: center; }
th:nth-child(3), td:nth-child(3) { text-align: right; }
th:nth-child(4), td:nth-child(4) { text-align: center; }

tr:hover {
background-color: #f1f8ff;
}
.empty-msg {
text-align: center;
color: #888;
padding: 20px;
font-style: italic;
}
</style>
</head>
<body>

<div class="container">
<!-- Фрейм для ввода данных -->
<div class="section">
<div class="section-title">Добавление школьника</div>
<div class="form-grid">
<label for="name">Имя:</label>
<input type="text" id="name" placeholder="Введите имя">

<label for="lgota1">Льгота 1:</label>
<input type="text" id="lgota1" placeholder="Введите (число)">

<label for="lgota2">Льгота 2:</label>
<input type="text" id="lgota2" placeholder="Введите значение (число)">

<label for="lgota3">Льгота 3:</label>
<input type="text" id="lgota3" placeholder="Введите значение (число)">

<button class="btn-add" onclick="addClient()">Добавить школьника</button>
</div>
</div>

<!-- Фрейм для управления -->
<div class="section">
<div class="section-title">Управление</div>
<div class="controls">
<button class="btn" onclick="updateCount()">Посчитать школьников</button>
<span class="count-label" id="countLabel">Всего: 0</span>

<div class="separator"></div>

<button class="btn" onclick="sortClients('lgota1')">Сорт. по Льготе 1</button>
<button class="btn" onclick="sortClients('lgota2')">Сорт. по Льготе 2</button>
<button class="btn" onclick="sortClients('lgota3')">Сорт. по Льготе 3</button>

<div class="separator"></div>

<!-- Скрытый инпут для выбора файла -->
<input type="file" id="fileInput" accept=".xlsx, .xls" style="display: none;" onchange="importFromExcel(event)">
<!-- Кнопка загрузки -->
<button class="btn btn-import" onclick="document.getElementById('fileInput').click()">Загрузить из Excel</button>

<!-- Кнопка выгрузки -->
<button class="btn btn-excel" id="exportBtn" onclick="exportToExcel()">Выгрузить в Excel</button>
</div>
</div>

<!-- Фрейм для таблицы -->
<div class="table-container">
<table>
<thead>
<tr>
<th>Имя</th>
<th>Льгота 1</th>
<th>Льгота 2</th>
<th>Льгота 3</th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>
<div id="emptyMsg" class="empty-msg">Список школьников пуст</div>
</div>
</div>

<script>
let clients = [];

const nameInput = document.getElementById('name');
const lgota1Input = document.getElementById('lgota1');
const lgota2Input = document.getElementById('lgota2');
const lgota3Input = document.getElementById('lgota3');

const tableBody = document.getElementById('tableBody');
const countLabel = document.getElementById('countLabel');
const emptyMsg = document.getElementById('emptyMsg');

function addClient() {
let name = nameInput.value.trim();
let lgota1Str = lgota1Input.value.trim();
let lgota2Str = lgota2Input.value.trim();
let lgota3Str = lgota3Input.value.trim();

if (!name) { alert("Ошибка ввода: Поле 'Имя' не может быть пустым."); return; }

let lgota1 = parseFloat(lgota1Str);
if (isNaN(lgota1)) { alert("Ошибка ввода: Льгота 1 должна быть числом."); return; }

let lgota2 = parseFloat(lgota2Str);
if (isNaN(lgota2)) { alert("Ошибка ввода: Льгота 2 должна быть числом."); return; }

let lgota3 = parseFloat(lgota3Str);
if (isNaN(lgota3)) { alert("Ошибка ввода: Льгота 3 должна быть числом."); return; }

clients.push({ name: name, lgota1: lgota1, lgota2: lgota2, lgota3: lgota3 });

nameInput.value = ''; lgota1Input.value = ''; lgota2Input.value = ''; lgota3Input.value = '';
nameInput.focus();

renderTable();
}

function updateCount() {
countLabel.textContent = `Всего: ${clients.length}`;
}

function sortClients(attribute) {
clients.sort((a, b) => {
if (typeof a[attribute] === 'string') return a[attribute].localeCompare(b[attribute]);
return a[attribute] - b[attribute];
});
renderTable();
}

function renderTable() {
tableBody.innerHTML = '';
emptyMsg.style.display = clients.length === 0 ? 'block' : 'none';

for (let client of clients) {
let row = document.createElement('tr');
row.innerHTML = `
<td>${client.name}</td>
<td>${client.lgota1.toFixed(2)}</td>
<td>${client.lgota2.toFixed(2)}</td>
<td>${client.lgota3.toFixed(2)}</td>
`;
tableBody.appendChild(row);
}
updateCount();
}

// --- ФУНКЦИЯ ЗАГРУЗКИ ИЗ EXCEL ---
function importFromExcel(event) {
const file = event.target.files[0]; // Получаем выбранный файл
if (!file) return;

const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            // Читаем книгу Excel
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Берем первый лист
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Конвертируем лист в массив JSON объектов
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

            if (jsonData.length === 0) {
                alert("Выбранный файл пуст.");
                return;
            }

            let importedCount = 0;
            let skippedCount = 0;

            // Обрабатываем каждую строку из файла
            for (let row of jsonData) {
                // Умный поиск данных: сначала ищем по нашим заголовкам, если их нет - берем по порядку столбцов
                let name = row["Имя школьника"] || row["Имя"] || row["name"] || Object.values(row)[0] || "";
                
                let lgota1 = parseFloat(row["Льгота 1"] || row["lgota1"] || Object.values(row)[1] || 0);
                let lgota2 = parseFloat(row["Льгота 2"] || row["lgota2"] || Object.values(row)[2] || 0);
                let lgota3 = parseFloat(row["Льгота 3"] || row["lgota3"] || Object.values(row)[3] || 0);

                // Если в строке есть хотя бы имя, добавляем школьника
                if (name.toString().trim() !== "") {
                    clients.push({
                        name: name.toString().trim(),
                        lgota1: isNaN(lgota1) ? 0 : lgota1,
                        lgota2: isNaN(lgota2) ? 0 : lgota2,
                        lgota3: isNaN(lgota3) ? 0 : lgota3
                    });
                    importedCount++;
                } else {
                    skippedCount++; // Пропускаем пустые строки
                }
            }

            renderTable(); // Обновляем таблицу на экране
            
            // Отчет о результатах
            let message = `Успешно загружено: ${importedCount} школьников.`;
            if (skippedCount > 0) message += ` Пропущено пустых строк: ${skippedCount}.`;
            alert(message);

        } catch (error) {
            console.error("Ошибка при чтении файла:", error);
            alert("Произошла ошибка при чтении файла. Убедитесь, что это корректный файл Excel (.xlsx).");
        }
    };
    
    // Запускаем чтение файла
    reader.readAsArrayBuffer(file);
    
    // ОЧЕНЬ ВАЖНО: сбрасываем значение инпута. 
    // Если пользователь захочет загрузить тот же самый файл снова, без этой строки событие 'change' не сработает.
    event.target.value = ''; 
}

// --- ФУНКЦИЯ ВЫГРУЗКИ В EXCEL ---
function exportToExcel() {
const btn = document.getElementById('exportBtn');
const originalText = btn.innerText;

if (clients.length === 0) {
alert("Список школьников пуст. Нечего выгружать.");
return;
}

try {
btn.innerText = 'Формирование...';
btn.disabled = true;

const dataForExcel = clients.map(c => ({
"Имя школьника": c.name,
"Льгота 1": c.lgota1,
"Льгота 2": c.lgota2,
"Льгота 3": c.lgota3
}));

const wb = XLSX.utils.book_new();
const ws = XLSX.utils.json_to_sheet(dataForExcel);

ws['!cols'] = [{ wch: 25 }, { wch: 15 }, { wch: 15 }, { wch: 15 }];
XLSX.utils.book_append_sheet(wb, ws, "Школьники");

XLSX.writeFile(wb, "Школьники_и_льготы.xlsx");

} catch (error) {
console.error("Ошибка при выгрузке Excel:", error);
alert("Произошла ошибка при выгрузке файла. Библиотека возможно не загружена.");
} finally {
btn.innerText = originalText;
btn.disabled = false;
}
}

// Первичная отрисовка
renderTable();
</script>

</body>
</html>
